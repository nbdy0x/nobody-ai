name: build-windows
run-name: "build windows"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web UI
        run: bun run --cwd packages/app build

      - name: Build binary
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: "0.0.0-dev-${{ github.run_number }}"
          OPENCODE_RELEASE: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nobody-ai-windows
          path: |
            packages/opencode/dist/nobody-ai-*
            packages/opencode/dist/opencode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nobody-ai-windows
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.18.${{ github.run_number }}
          name: "Nobody AI v1.18.${{ github.run_number }}"
          body: "Windows build from dev branch"
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
