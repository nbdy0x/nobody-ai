name: build-release
run-name: "build release v${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Web UI
        run: bun run --cwd packages/app build

      - name: Build binary
        run: |
          cd packages/opencode
          bun run script/build.ts --single
        env:
          OPENCODE_VERSION: "0.0.0-dev-${{ github.run_number }}"
          OPENCODE_RELEASE: "true"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nobody-ai-${{ matrix.target }}
          path: |
            packages/opencode/dist/nobody-ai-*
            packages/opencode/dist/opencode-*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.17.${{ github.run_number }}
          name: "Nobody AI v1.17.${{ github.run_number }}"
          body: "Auto-built from dev branch"
          files: artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
